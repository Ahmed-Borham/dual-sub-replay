name: Build modified APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Keeps the same signing key between builds, so a new APK installs over the old one.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dual-sub-replay-mod-signing-v1

      - name: Build APK
        run: |
          set -euo pipefail
          version_code=$(( $(date -u +%s) - 1700000000 ))
          bash ./gradlew assembleDebug \
            -PpreviewVersionCode="$version_code" \
            -PpreviewVersionNameSuffix="-mod${GITHUB_RUN_NUMBER}" \
            -PpreviewApplicationIdSuffix=".preview" \
            --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DualSub-Replay-mod.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualSub-Replay-mod
          path: DualSub-Replay-mod.apk
          if-no-files-found: error
          retention-days: 30
